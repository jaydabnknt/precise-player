name: Build app

on:
  push:
    branches: [main]
    paths-ignore: [".github/workflows/native.yml", "**.md", "store/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  ENGINE_TAG: engine-v1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Get the playback engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$ENGINE_TAG" -p engine.zip -R "$GITHUB_REPOSITORY"
          unzip -o -q engine.zip -d engine
          mkdir -p app/src/main/jniLibs app/src/main/assets
          cp -r engine/jniLibs/* app/src/main/jniLibs/
          cp engine/assets/cacert.pem app/src/main/assets/
          strip="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          [ -x "$strip" ] && "$strip" --strip-unneeded app/src/main/jniLibs/arm64-v8a/*.so || echo "llvm-strip not found, skipping"
          ls -la app/src/main/jniLibs/arm64-v8a

      - name: Build
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee step.log
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then echo "::notice title=Signing::Signed with the Play upload key"; else echo "::notice title=Signing::No upload key secrets yet; signed with the debug key"; fi

      # Put the end of a failed step's output into an annotation, readable through the API
      - name: Report failure
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          try:
              log = open('step.log', errors='replace').read()
          except FileNotFoundError:
              log = 'no log'
          lines = [l for l in log.splitlines() if l.strip()]
          errs = [l for l in lines if re.search(r'^e: |error:|Error|Exception|FAILED|What went wrong|Unresolved', l)]
          text = '\n'.join(errs[:80]) + '\n----- tail -----\n' + '\n'.join(lines[-60:])
          text = text[-14000:].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::error title=Build log::' + text)
          PY

      - name: Name the outputs
        run: |
          cp app/build/outputs/apk/release/app-release.apk PrecisePlayer.apk
          cp app/build/outputs/bundle/release/app-release.aab PrecisePlayer.aab
          ls -la PrecisePlayer.*

      - uses: actions/upload-artifact@v4
        with:
          name: PrecisePlayer
          path: |
            PrecisePlayer.apk
            PrecisePlayer.aab

      # https://github.com/<owner>/<repo>/releases/latest/download/PrecisePlayer.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Precise Player build ${{ github.run_number }}
          body: |
            Built from ${{ github.sha }}.
            **PrecisePlayer.apk** — open on your phone to install or update.
            **PrecisePlayer.aab** — the file to upload to Google Play Console.
          files: |
            PrecisePlayer.apk
            PrecisePlayer.aab
          make_latest: true
