# Installs the latest build on an Android emulator, plays a generated test video, seeks and
# frame-steps, and publishes screenshots + logcat to the "smoke-test" release for review.
name: Smoke test

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build app"]
    types: [completed]

permissions:
  contents: write

jobs:
  emulator:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Get APK and make a test video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list -R "$GITHUB_REPOSITORY" --limit 50 --json tagName -q '[.[] | select(.tagName | startswith("build-"))][0].tagName')
          echo "Testing $tag"
          gh release download "$tag" -p PrecisePlayer.apk -R "$GITHUB_REPOSITORY"
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -loglevel error -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=20" -f lavfi -i "sine=frequency=440:duration=20" \
            -vf "drawtext=text='%{n}':fontsize=96:fontcolor=white:x=40:y=40:box=1:boxcolor=black" \
            -c:v libx264 -g 60 -pix_fmt yuv420p -c:a aac -shortest test.mp4
          ls -la test.mp4 PrecisePlayer.apk

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/smoke.sh

      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la smoke || true
          [ -d smoke ] || exit 0
          (cd smoke && zip -q ../smoke.zip *)
          gh release delete smoke-test -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create smoke-test smoke.zip smoke/*.png smoke/*.txt -R "$GITHUB_REPOSITORY" --prerelease \
            --title "Smoke test results" --notes "Emulator run of the latest build. Not an app release." --target "$GITHUB_SHA"
